<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Menú Principal - BuildCalc</title>
        <meta name="author" content="Juan Sebastian Hernandez, Santiago Gutierrez Montealegre, Gabriel Gutierrez Murcia">
        <meta name="description" content="Ingresa la longitud de una columna de concreto para estimar cemento, arena, piedra y hierro con los coeficientes académicos del proyecto.">
        <link rel="stylesheet" href="CSS/style.css">
        <link rel="shortcut icon" href="IMG/BuildCalc LOGO.PNG"> 
        <script src="https://kit.fontawesome.com/9d1a86738f.js" crossorigin="anonymous"></script>
    </head>
    <body>

        <div class="login-container menu-container dimensions-card">
        
            <!-- Encabezado regresa al menú -->
            <header class="menu-header">
                <a href="menu.html" class="btn-volver">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div class="logo-icon small-menu-logo">
                    <i class="fa-solid fa-cube"></i>
                </div>
            </header>

            <div class="split-layout">
            
                <!-- Teclado funcional -->
                <div class="left-panel">
                    <div class="keypad">
                        <button class="key-btn" onclick="escribir('1')">1</button>
                        <button class="key-btn" onclick="escribir('2')">2</button>
                        <button class="key-btn" onclick="escribir('3')">3</button>
                        <button class="key-btn" onclick="escribir('4')">4</button>
                        <button class="key-btn" onclick="escribir('5')">5</button>
                        <button class="key-btn" onclick="escribir('6')">6</button>
                        <button class="key-btn" onclick="escribir('7')">7</button>
                        <button class="key-btn" onclick="escribir('8')">8</button>
                        <button class="key-btn" onclick="escribir('9')">9</button>
                        <button class="key-btn dark-key" onclick="escribir('.')"><i class="fa-solid fa-circle-dot"></i></button>
                        <button class="key-btn" onclick="escribir('0')">0</button>
                        <button class="key-btn dark-key" onclick="borrar()"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                
                    <!-- Botón que llevará a los resultados de la columna -->
                    <a href="resultado-columna.html" class="btn-calcular" style="display: flex; justify-content: center; align-items: center; text-decoration: none;">CALCULAR</a>
                </div>

                <div class="right-panel">
                    <div class="right-titles">
                        <h1 class="main-title title-right">COLUMNAS<br>DE CONCRETO</h1>
                        <p class="subtitle-question title-right">INGRESE EL LARGO DE LA COLUMNA</p>
                    </div>

                    <div class="inputs-section">
                        <!-- Único Input: Largo -->
                        <div class="input-group calc-input-group">
                            <label for="largo-columna">Largo (m)</label>
                            <div class="custom-input-wrapper">
                                <input type="text" inputmode="decimal" id="largo-columna" placeholder="0.0">
                                <span class="unit">metros</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <footer class="footer-text">
            <p>gmurcia &copy; 2026</p>
        </footer>

        <!-- Conectamos el script de la columna -->
        <script src="JS/comun.js"></script>
    <script src="JS/columna.js"></script>
    </body>
</html>
