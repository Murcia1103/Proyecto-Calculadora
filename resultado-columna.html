<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Menú Principal - BuildCalc</title>
        <meta name="author" content="Juan Sebastian Hernandez, Santiago Gutierrez Montealegre, Gabriel Gutierrez Murcia">
        <meta name="description" content="Consulta la estimación de cemento, agregados y hierro calculada para la columna de concreto.">
        <link rel="stylesheet" href="CSS/style.css">
        <link rel="shortcut icon" href="IMG/BuildCalc LOGO.PNG"> 
        <script src="https://kit.fontawesome.com/9d1a86738f.js" crossorigin="anonymous"></script>
    </head>
    
    <body>

        <div class="login-container menu-container results-card">
        
            <!-- Encabezado regresa a las dimensiones de la columna -->
            <header class="menu-header">
                <a href="columnas-concreto.html" class="btn-volver">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div class="logo-icon small-menu-logo">
                    <i class="fa-solid fa-cube"></i>
                </div>
            </header>

            <!-- Títulos de la sección actualizados -->
            <div class="right-titles">
                <h1 class="main-title title-right">MATERIALES<br>NECESARIOS</h1>
                <p class="subtitle-question title-right">PARA LA COLUMNA DE CONCRETO</p>
            </div>

            <!-- Caja de Resultados -->
            <div class="results-section">
            
                <!-- Botón para regresar al menú principal -->
                <a href="menu.html" class="btn-otro-calculo">HACER OTRO CÁLCULO</a>

                <!-- Lista de Materiales -->
                <div class="results-box">
                
                    <!-- Cemento -->
                    <div class="result-item">
                        <div class="item-name">
                            <i class="fa-solid fa-cube"></i> Cemento
                        </div>
                        <div class="item-value">
                            <span id="res-columna-cemento">—</span> Kg
                        </div>
                    </div>

                    <!-- Arena -->
                    <div class="result-item">
                        <div class="item-name">
                            <i class="fa-solid fa-database"></i> Arena
                        </div>
                        <div class="item-value">
                            <span id="res-columna-arena">—</span> m³
                        </div>
                    </div>

                    <!-- Piedra -->
                    <div class="result-item">
                        <div class="item-name">
                            <i class="fa-solid fa-mountain"></i> Piedra
                        </div>
                        <div class="item-value">
                            <span id="res-columna-piedra">—</span> m³
                        </div>
                    </div>

                    <!-- Hierro De 10 -->
                    <div class="result-item">
                        <div class="item-name">
                            <i class="fa-solid fa-cubes"></i> Hierro De 10
                        </div>
                        <div class="item-value">
                            <span id="res-columna-hierro10">—</span> m
                        </div>
                    </div>

                    <!-- Hierro De 4 -->
                    <div class="result-item no-border">
                        <div class="item-name">
                            <i class="fa-solid fa-cubes"></i> Hierro De 4
                        </div>
                        <div class="item-value">
                            <span id="res-columna-hierro4">—</span> m
                        </div>
                    </div>

                </div>
            </div>

        </div>

        <footer class="footer-text">
            <p>gmurcia &copy; 2026</p>
        </footer>

        <script src="JS/comun.js"></script>
    <script src="JS/columna.js"></script>
</body>
</html>
