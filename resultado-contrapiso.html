<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Resultados Contrapisos - BuildCalc</title>
        <meta name="author" content="Juan Sebastian Hernandez, Santiago Gutierrez Montealegre, Gabriel Gutierrez Murcia">
        <meta name="description" content="Consulta las cantidades estimadas de cemento, arena y piedra para el volumen de contrapiso ingresado.">
        <link rel="stylesheet" href="CSS/style.css">
        <link rel="shortcut icon" href="IMG/BuildCalc LOGO.PNG"> 
        <script src="https://kit.fontawesome.com/9d1a86738f.js" crossorigin="anonymous"></script>
    </head>

    <body>

        <div class="login-container menu-container results-card">

            <!-- Encabezado regresa a las dimensiones de los contrapisos -->
            <header class="menu-header">
                <a href="contrapisos.html" class="btn-volver">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div class="logo-icon small-menu-logo">
                    <i class="fa-solid fa-cube"></i>
                </div>
            </header>

            <!-- Títulos de la sección -->
            <div class="right-titles">
                <h1 class="main-title title-right">MATERIALES<br>NECESARIOS</h1>
                <p class="subtitle-question title-right">PARA LOS CONTRAPISOS</p>
            </div>

            <!-- Caja de Resultados -->
            <div class="results-section">
            
                <!-- Botón para regresar al menú principal -->
                <a href="menu.html" class="btn-otro-calculo">HACER OTRO CÁLCULO</a>

                <!-- Lista de Materiales (Solo 3 para esta pantalla) -->
                <div class="results-box">
                
                    <!-- Cemento -->
                    <div class="result-item">
                        <div class="item-name">
                            <i class="fa-solid fa-cube"></i> Cemento
                        </div>
                        <div class="item-value">
                            <span id="res-contrapiso-cemento">—</span> Kg
                        </div>
                    </div>

                    <!-- Arena -->
                    <div class="result-item">
                        <div class="item-name">
                            <i class="fa-solid fa-database"></i> Arena
                        </div>
                        <div class="item-value">
                            <span id="res-contrapiso-arena">—</span> m³
                        </div>
                    </div>

                    <!-- Piedra (Lleva la clase no-border por ser el último) -->
                    <div class="result-item no-border">
                        <div class="item-name">
                            <i class="fa-solid fa-mountain"></i> Piedra
                        </div>
                        <div class="item-value">
                            <span id="res-contrapiso-piedra">—</span> m³
                        </div>
                    </div>

                </div>
            </div>

        </div>

        <footer class="footer-text">
            <p>gmurcia &copy; 2026</p>
        </footer>

        <script src="JS/comun.js"></script>
    <script src="JS/contrapisos.js"></script>
</body>
</html>
