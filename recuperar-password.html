<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Recover Password - BuildCalc</title>
        <meta name="author" content="Juan Sebastian Hernandez, Santiago Gutierrez Montealegre, Gabriel Gutierrez Murcia">
        <meta name="description" content="Consulta la recuperación simulada de acceso a BuildCalc. Esta demostración local no envía correos ni restablece contraseñas.">
        <link rel="stylesheet" href="CSS/style.css">
        <link rel="shortcut icon" href="IMG/BuildCalc LOGO.PNG"> 
        <script src="https://kit.fontawesome.com/9d1a86738f.js" crossorigin="anonymous"></script>
    </head>

    <body>

        <!-- Tarjeta de Recuperación -->
        <div class="login-container">
        
            <div class="logo-icon">
                <i class="fa-solid fa-cube"></i>
            </div>

            <h2>Recuperar Contraseña</h2>
            <p class="subtitle">Ingresa tu correo registrado. Esta versión simula la recuperación y no envía correos reales.</p>

            <!-- Formulario -->
            <form id="recover-form" action="#">
            
                <div class="input-group">
                    <label for="email">CORREO ELECTRÓNICO REGISTRADO</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>

                <!-- Mensaje de éxito (Oculto por defecto) -->
                <p id="success-message" style="display: none; color: #2d8a3a; font-size: 1.3vmin; margin-bottom: 2vh; font-weight: 600; text-align: center;">
                    ¡Enlace enviado! Por favor, revisa tu bandeja de entrada.
                </p>

                <!-- Botón principal -->
                <button type="submit" class="btn-login">Enviar Enlace</button>
            </form>
        </div>

        <!-- Enlace para volver al login -->
        <div class="register-link">
            <p>¿Recordaste tu contraseña? <a href="index.html">Inicia sesión aquí</a></p>
        </div>

        <!-- Footer de la marca -->
        <footer class="footer-text">
            <p><a href="#">Términos y Condiciones</a> | <a href="#">Políticas de Privacidad</a></p>
            <p>gmurcia &copy; 2026</p>
        </footer>

        <!-- Script de esta pantalla -->
        <script src="JS/recuperar-password.js"></script>
    </body>
</html>
